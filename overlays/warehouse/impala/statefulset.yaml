  replicas: 1
  selector:
    matchLabels:
      app: impala
      role: catalogd
  template:
    metadata:
      labels:
        app: impala
        role: catalogd
    spec:
      serviceAccountName: impala
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: catalogd
          image: apache/impala:4.5.3-catalogd
          imagePullPolicy: IfNotPresent
          args:
            - -hostname=$(POD_FQDN)
            - -use_resolved_hostname=false
            - -principal=impala/$(POD_FQDN)@WAREHOUSE.LAB
            - -keytab_file=/etc/impala/keytab/$(POD_NAME).keytab
            - -state_store_host=impala-statestored-0.impala-headless.warehouse.svc.cluster.local
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_FQDN
              value: $(POD_NAME).impala-headless.warehouse.svc.cluster.local
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx2g
          ports:
            - containerPort: 26000
            - containerPort: 25020
          readinessProbe:
            tcpSocket:
              port: 25020
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 25020
            initialDelaySeconds: 120
            periodSeconds: 30
          volumeMounts:
            - name: impala-conf
              mountPath: /opt/impala/conf
              readOnly: true
            - name: kerberos-config
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
              readOnly: true
            - name: kerberos-keytabs
              mountPath: /etc/impala/keytab
              readOnly: true
          resources:
