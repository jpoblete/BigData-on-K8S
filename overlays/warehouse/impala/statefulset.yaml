              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 3Gi
      volumes:
        - name: impala-conf
          configMap:
            name: impala-conf
        - name: kerberos-config
          configMap:
            name: kerberos-client
            items:
              - key: krb5.conf
                path: krb5.conf
        - name: kerberos-keytabs
          secret:
            secretName: kerberos-keytabs
            defaultMode: 0440
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: impalad
  namespace: warehouse
  labels:
    app: impala
    role: impalad
spec:
  serviceName: impala-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: impala
      role: impalad
  template:
    metadata:
      labels:
        app: impala
        role: impalad
    spec:
      serviceAccountName: impala
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      # One impalad per node that runs an HDFS DataNode. The DataNodes are pinned to their nodes by
      # their local-path PVs, so impalad follows them after a restore or reschedule. Reads still go
      # over the pod network (different pod IPs), so Impala does not count them as local.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: hadoop-datanode
              topologyKey: kubernetes.io/hostname
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: impala
                  role: impalad
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: impalad
          image: apache/impala:4.5.3-impalad_coord_exec
          imagePullPolicy: IfNotPresent
          args:
            - -hostname=$(POD_FQDN)
            - -use_resolved_hostname=false
            - -principal=impala/$(POD_FQDN)@WAREHOUSE.LAB
            - -keytab_file=/etc/impala/keytab/$(POD_NAME).keytab
            - -state_store_host=impala-statestored-0.impala-headless.warehouse.svc.cluster.local
            - -catalog_service_host=impala-catalogd-0.impala-headless.warehouse.svc.cluster.local
            - -mem_limit=5g
            - -scratch_dirs=/scratch
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_FQDN
              value: $(POD_NAME).impala-headless.warehouse.svc.cluster.local
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx1g
          ports:
            - containerPort: 21000
            - containerPort: 21050
            - containerPort: 25000
            - containerPort: 27000
            - containerPort: 28000
          readinessProbe:
            tcpSocket:
              port: 21050
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 25000
            initialDelaySeconds: 120
            periodSeconds: 30
          volumeMounts:
            - name: impala-conf
              mountPath: /opt/impala/conf
              readOnly: true
            - name: kerberos-config
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
              readOnly: true
            - name: kerberos-keytabs
              mountPath: /etc/impala/keytab
              readOnly: true
            - name: scratch
              mountPath: /scratch
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 6Gi
      volumes:
        - name: impala-conf
          configMap:
            name: impala-conf
        - name: kerberos-config
          configMap:
            name: kerberos-client
            items:
              - key: krb5.conf
                path: krb5.conf
        - name: kerberos-keytabs
          secret:
            secretName: kerberos-keytabs
            defaultMode: 0440
        - name: scratch
          emptyDir:
            sizeLimit: 10Gi
