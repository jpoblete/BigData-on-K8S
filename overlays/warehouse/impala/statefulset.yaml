# Impala 4.5.3: impala-statestored-0, impala-catalogd-0, impalad-0..2. The image entrypoint already sets
# -state_store_host=statestored / -catalog_service_host=catalogd; the args below override them with the
# headless FQDNs, which the Kerberos principals are issued for.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: impala-statestored
  namespace: warehouse
  labels:
    app: impala
    role: statestored
spec:
  serviceName: impala-headless
  replicas: 1
  selector:
    matchLabels:
      app: impala
      role: statestored
  template:
    metadata:
      labels:
        app: impala
        role: statestored
    spec:
      serviceAccountName: impala
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: statestored
          image: apache/impala:4.5.3-statestored
          imagePullPolicy: IfNotPresent
          args:
            - -hostname=$(POD_FQDN)
            - -use_resolved_hostname=false
            - -principal=impala/$(POD_FQDN)@WAREHOUSE.LAB
            - -keytab_file=/etc/impala/keytab/$(POD_NAME).keytab
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_FQDN
              value: $(POD_NAME).impala-headless.warehouse.svc.cluster.local
          ports:
            - containerPort: 24000
            - containerPort: 25010
          readinessProbe:
            tcpSocket:
              port: 25010
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 25010
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: impala-conf
              mountPath: /opt/impala/conf
              readOnly: true
            - name: kerberos-config
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
              readOnly: true
            - name: kerberos-keytabs
              mountPath: /etc/impala/keytab
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: impala-conf
          configMap:
            name: impala-conf
        - name: kerberos-config
          configMap:
            name: kerberos-client
            items:
              - key: krb5.conf
                path: krb5.conf
        - name: kerberos-keytabs
          secret:
            secretName: kerberos-keytabs
            defaultMode: 0440
---
apiVersion: apps/v1
kind: StatefulSet
